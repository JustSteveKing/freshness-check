[project]
name = "freshness-check"
version = "0.1.0"
description = "Check whether a model you run can answer current questions, with and without a Tabstack Research call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "openai>=1.40",
    "rich>=13.7",
    "tabstack>=2.8",
]

[project.scripts]
freshness-check = "freshness_check.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshness_check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
